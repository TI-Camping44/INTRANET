# PostgREST delante de la base local de demostracion.
#
# El secreto NO va escrito aca: se genera al levantar y se exporta,
# porque este repositorio es publico.
#   export PGRST_JWT_SECRET=$(openssl rand -base64 48)
db-uri     = "postgresql://authenticator@localhost:5433/intranet"
db-schemas = "public"
db-anon-role = "anon"
server-port = 3001
server-host = "127.0.0.1"
db-pool = 10
